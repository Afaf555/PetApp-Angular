<div class="form-wrapper py-5">
  <div class="report-card">

    <div class="report-header">
      <span class="report-icon">🏡</span>
      <h2>Have a Pet for Adoption</h2>
      <p>Share details about a pet looking for a new home.</p>
    </div>

    <form (ngSubmit)="onSubmit()">

      <div class="form-group">
        <label>Pet Name</label>
        <input type="text" class="form-control"
               [(ngModel)]="petForm.name"
               name="name" required>
      </div>

      <div class="form-row-2">
        <div class="form-group">
          <label>Type</label>
          <select class="form-select"
                  [(ngModel)]="petForm.type"
                  name="type">
            <option>Dog</option>
            <option>Cat</option>
            <option>Other</option>
          </select>
        </div>

        <div class="form-group">
          <label>Breed</label>
          <input type="text" class="form-control"
                 [(ngModel)]="petForm.breed"
                 name="breed">
        </div>
      </div>

      <div class="form-row-2">
        <div class="form-group">
          <label>Age</label>
          <input type="text" class="form-control"
                 [(ngModel)]="petForm.age"
                 name="age">
        </div>

        <div class="form-group">
          <label>Color</label>
          <input type="text" class="form-control"
                 [(ngModel)]="petForm.color"
                 name="color">
        </div>
      </div>

      <div class="form-group">
        <label>Description</label>
        <textarea class="form-control" rows="3"
                  [(ngModel)]="petForm.description"
                  name="description">
        </textarea>
      </div>

      <div class="form-group">
        <label>Upload Image</label>

        <div class="upload-box" (click)="imageInput.click()">
          <span>📎 Click to upload</span>
        </div>

        <input type="file" #imageInput hidden (change)="onImageSelected($event)">

        <div class="preview mt-2" *ngIf="previewUrl">
          <img [src]="previewUrl">
        </div>
      </div>

      <div class="form-group">
        <label>Contact Info</label>
        <input type="text" class="form-control"
               [(ngModel)]="petForm.contact"
               name="contact" required>
      </div>

      <button type="submit" class="btn-submit">Publish Pet</button>
    </form>

    <div *ngIf="submitted" class="success-msg">
      <span>✅</span>
      <div>
        <strong>Pet added!</strong>
        <p>Others can now see and adopt your pet 🐾</p>
      </div>
    </div>

  </div>
</div>
